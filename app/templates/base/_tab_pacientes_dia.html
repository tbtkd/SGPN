<!-- Tab 1: Pacientes del Día -->
<table class="w-full text-sm text-left border-collapse relative">
    <thead class="text-xs text-gray-500 uppercase bg-gray-50 sticky top-0 z-10">
        <tr>
            <th class="px-6 py-4 font-medium">PACIENTE</th>
            <th class="px-6 py-4 font-medium">DETALLE</th>
            <th class="px-6 py-4 font-medium text-right">ACCIÓN</th>
        </tr>
    </thead>
    <tbody class="divide-y divide-gray-100">
        {% for p in proximos_pacientes %}
        <tr class="bg-white hover:bg-gray-50/50 transition-colors">
            <td class="px-6 py-4 font-medium text-gray-900">{{ p.nombre }} {{ p.apellido_paterno }}</td>
            <td class="px-6 py-4 text-gray-600">
                {% set fecha_hora = p.proxima_cita.split(' ') %}
                Cita: {{ fecha_hora[0]|format_date }} {{ fecha_hora[1] }}
            </td>
            <td class="px-6 py-4 text-right flex justify-end gap-2">
                <a href="{{ url_for('valoracion.nueva_valoracion', paciente_id=p.paciente_id) }}" class="px-3 py-1.5 bg-teal-600 hover:bg-teal-700 text-white rounded-xl text-xs font-semibold shadow-sm transition-colors">Iniciar Consulta</a>
                <a href="{{ url_for('pacientes.detalle_paciente', id=p.paciente_id) }}" class="px-3 py-1.5 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-xl text-xs font-semibold transition-colors">Ver Expediente</a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
