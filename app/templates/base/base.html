<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sistema de Pacientes{% endblock %}</title>
    <link rel="icon" href="{{ url_for('static', filename='img/icons/logo.ico') }}" type="image/x-icon">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/components/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/components/_forms.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/components/_tables.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/components/_buttons.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/components/_cards.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/components/_tabs.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/components/_modal.css') }}">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased min-h-screen flex"
      x-data="{ 
        sidebarOpen: localStorage.getItem('sidebar_state') === 'true',
        mobileOpen: false,
        toggleSidebar() {
            this.sidebarOpen = !this.sidebarOpen;
            localStorage.setItem('sidebar_state', this.sidebarOpen);
        }
      }">

    <!-- 1. SIDEBAR (Izquierda) -->
    <aside class="w-20 lg:w-64 min-h-screen bg-white border-r border-gray-100 flex flex-col flex-shrink-0 transition-all duration-300"
           :class="mobileOpen ? 'fixed inset-y-0 left-0 z-50 translate-x-0' : '-translate-x-full lg:translate-x-0'">
        
        <!-- Contenido del Sidebar -->
        <div class="flex-1 p-4">
            <div class="h-16 flex items-center justify-between px-2 mb-6">
                <img src="{{ url_for('static', filename='img/logos/logo.png') }}" alt="Logo" class="h-8 w-auto">
                <button @click="toggleSidebar()" class="hidden lg:block text-gray-500 hover:text-teal-600">
                    <i class="fas fa-bars"></i>
                </button>
            </div>
            
            <!-- Menú de navegación -->
            <nav class="space-y-2">
                <a href="{{ url_for('main.index') }}" class="flex items-center gap-4 px-4 py-3 text-gray-600 hover:bg-teal-50 hover:text-teal-700 rounded-xl transition-colors">
                    <i class="fas fa-th-large text-xl"></i>
                    <span class="hidden lg:inline font-medium">Inicio</span>
                </a>
            </nav>
        </div>

        <!-- FOOTER DEL SIDEBAR (Botón Salir) -->
        <div class="p-4 border-t border-gray-100">
            <a href="{{ url_for('auth.logout') }}" class="inline-flex items-center gap-2 text-red-600 hover:text-red-700 font-medium text-sm transition-colors">
                <i class="fas fa-sign-out-alt"></i>
                <span class="hidden lg:inline">Salir</span>
            </a>
        </div>
    </aside>

    <!-- 2. CONTENIDO PRINCIPAL (Derecha) -->
    <div class="flex-1 flex flex-col min-w-0 min-h-screen overflow-y-auto">
        <main class="flex-1 w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="mb-6 p-4 rounded-xl {{ 'bg-green-100 text-green-800' if category == 'success' else 'bg-red-100 text-red-800' }}">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}
            {% block content %}{% endblock %}
        </main>
    </div>

    {% block scripts %}{% endblock %}
</body>
</html>
