<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sistema de Pacientes{% endblock %}</title>
    <link rel="icon" href="{{ url_for('static', filename='img/icons/logo.ico') }}" type="image/x-icon">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/components/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/components/_forms.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/components/_tables.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/components/_buttons.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/components/_cards.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/components/_tabs.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/components/_modal.css') }}">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 text-gray-900"
      x-data="{ 
        sidebarOpen: localStorage.getItem('sidebar_state') === 'true',
        mobileOpen: false,
        toggleSidebar() {
            this.sidebarOpen = !this.sidebarOpen;
            localStorage.setItem('sidebar_state', this.sidebarOpen);
        }
      }">

    <div class="flex min-h-screen">
        <!-- Sidebar -->
        <aside :class="sidebarOpen ? 'w-64' : 'w-20'" 
               class="fixed inset-y-0 left-0 z-50 bg-white border-r border-gray-200 transition-all duration-300 ease-in-out flex flex-col"
               :class="mobileOpen ? 'translate-x-0' : '-translate-x-full md:translate-x-0'">
            
            <!-- Header -->
            <div class="h-20 flex items-center justify-between px-4 border-b border-gray-100">
                <img src="{{ url_for('static', filename='img/logos/logo.png') }}" 
                     alt="Logo" 
                     class="h-10 w-auto"
                     onerror="this.onerror=null; this.src='{{ url_for('static', filename='img/logos/default-logo.png') }}'">
                <button @click="toggleSidebar()" class="text-gray-500 hover:text-teal-600 transition-transform duration-300" :class="sidebarOpen ? '' : 'rotate-180'">
                    <i class="fas fa-chevron-left"></i>
                </button>
            </div>

            <!-- Navigation -->
            <nav class="flex-1 py-6 space-y-2">
                <a href="{{ url_for('main.index') }}" 
                   class="flex items-center px-6 py-3 text-gray-600 hover:bg-teal-50 hover:text-teal-700 transition-colors relative group">
                    <i class="fas fa-th-large text-xl"></i>
                    <span x-show="sidebarOpen" class="ml-4 font-medium">Inicio</span>
                    <span x-show="!sidebarOpen" class="absolute left-full ml-2 px-2 py-1 bg-gray-800 text-white text-xs rounded opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap">Inicio</span>
                </a>
            </nav>

            <!-- Footer -->
            <footer class="p-6 border-t border-gray-100">
                <a href="{{ url_for('auth.logout') }}" class="inline-flex items-center gap-2 text-red-600 hover:text-red-700 font-medium text-sm transition-colors">
                    <i class="fas fa-sign-out-alt"></i>
                    <span x-show="sidebarOpen">Salir</span>
                </a>
            </footer>
        </aside>

        <!-- Overlay Mobile -->
        <div x-show="mobileOpen" @click="mobileOpen = false" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-40 md:hidden"></div>

        <!-- Main Content -->
        <main class="flex-1 transition-all duration-300" :class="sidebarOpen ? 'md:ml-64' : 'md:ml-20'">
            <div class="p-8">
                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                        {% for category, message in messages %}
                            <div x-data="{ show: true }" x-init="setTimeout(() => show = false, 5000)" x-show="show" class="mb-6 p-4 rounded-xl {{ 'bg-green-100 text-green-800' if category == 'success' else 'bg-red-100 text-red-800' }}">
                                {{ message }}
                            </div>
                        {% endfor %}
                    {% endif %}
                {% endwith %}
                {% block content %}{% endblock %}
            </div>
        </main>
    </div>
    {% block scripts %}{% endblock %}
</body>
</html>
