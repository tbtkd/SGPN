<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sistema de Pacientes{% endblock %}</title>
    <link rel="icon" href="{{ url_for('static', filename='img/icons/logo.ico') }}" type="image/x-icon">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/components/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/components/_forms.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/components/_tables.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/components/_buttons.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/components/_cards.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/components/_tabs.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/components/_modal.css') }}">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased min-h-screen flex" x-data="{ sidebarOpen: true }">

    <!-- 2. ESTRUCTURA DEL SIDEBAR FIJO -->
    <aside :class="sidebarOpen ? 'w-64' : 'w-20'" class="h-screen sticky top-0 bg-white border-r border-gray-100 flex flex-col justify-between flex-shrink-0 transition-all duration-300 z-30">

        <!-- A. CABECERA DEL SIDEBAR -->
        <div class="p-4 flex items-center justify-between border-b border-gray-50">
            <div class="flex items-center gap-3 overflow-hidden">
                <img src="{{ url_for('static', filename='img/logos/logo.png') }}" alt="Logo" class="h-8 w-auto" x-show="sidebarOpen">
                <img src="{{ url_for('static', filename='img/icons/logo.ico') }}" alt="Logo" class="h-8 w-auto" x-show="!sidebarOpen">
            </div>
            <!-- Botón Toggle -->
            <button @click="sidebarOpen = !sidebarOpen" class="p-1.5 rounded-lg text-gray-400 hover:text-gray-600 hover:bg-gray-100 transition-colors">
                <span x-text="sidebarOpen ? '◀' : '▶'"></span>
            </button>
        </div>

        <!-- B. MENÚ DE NAVEGACIÓN -->
        <nav class="flex-1 overflow-y-auto p-3 space-y-1">
            <a href="{{ url_for('main.index') }}" class="flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-teal-50 hover:text-teal-700 transition-colors">
                <i class="fas fa-th-large text-lg"></i>
                <span x-show="sidebarOpen" class="font-medium text-sm">Inicio</span>
            </a>
        </nav>

        <!-- C. FOOTER DEL SIDEBAR -->
        <div class="p-4 border-t border-gray-100 bg-white">
            <a href="{{ url_for('auth.logout') }}" class="flex items-center gap-3 text-red-600 hover:text-red-700 font-semibold text-sm transition-colors">
                <span class="text-lg">🚪</span>
                <span x-show="sidebarOpen">Salir</span>
            </a>
        </div>
    </aside>

    <!-- 3. CONTENIDO PRINCIPAL DERECHO -->
    <div class="flex-1 flex flex-col min-w-0 min-h-screen overflow-y-auto">
        <main class="flex-1 w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="mb-6 p-4 rounded-xl {{ 'bg-green-100 text-green-800' if category == 'success' else 'bg-red-100 text-red-800' }}">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}
            {% block content %}{% endblock %}
        </main>
    </div>

    {% block scripts %}{% endblock %}
</body>
</html>
