<!-- Tab 1: Pacientes del Día -->
<table class="w-full text-sm text-left border-collapse relative">
    <thead class="text-xs text-gray-500 uppercase bg-gray-50 sticky top-0 z-10">
        <tr>
            <th class="px-6 py-4 font-medium">PACIENTE</th>
            <th class="px-6 py-4 font-medium">DETALLE</th>
            <th class="px-6 py-4 font-medium text-right">ACCIÓN</th>
        </tr>
    </thead>
    <tbody class="divide-y divide-gray-100">
        {% for c in citas_del_dia %}
        <tr class="bg-white hover:bg-gray-50/50 transition-colors">
            <td class="px-6 py-4 font-medium text-gray-900">{{ c.nombre }} {{ c.apellido_paterno }}</td>
            <td class="px-6 py-4 text-gray-600">
                <div class="flex flex-col sm:flex-row sm:items-center gap-2">
                    <span class="font-medium text-gray-800">{{ c.fecha|format_date }}</span>
                    <span class="text-xs font-semibold text-teal-700 bg-teal-50 px-2 py-0.5 rounded-md border border-teal-100">{{ c.hora }}</span>
                </div>
            </td>
            <td class="px-6 py-4 text-right min-w-[220px] whitespace-nowrap">
                <div class="flex items-center justify-end gap-2.5">
                    <a href="{{ url_for('valoracion.nueva_valoracion', paciente_id=c.paciente_id) }}" class="px-3 py-1.5 bg-teal-600 hover:bg-teal-700 text-white rounded-xl text-xs font-semibold shadow-sm transition-colors">Iniciar Consulta</a>
                    <a href="{{ url_for('pacientes.detalle_paciente', id=c.paciente_id) }}" class="px-3 py-1.5 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-xl text-xs font-semibold transition-colors">Ver Expediente</a>
                </div>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
